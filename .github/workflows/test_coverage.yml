name: Golden (uv.lock) tests on all OSes

# Every push, on every branch; pull requests are covered by the OS workflows
on:
  push:

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  golden:
    name: Golden env (uv.lock) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
            

      # PySide6 links against the system GL/EGL libraries, which the GitHub
      # Linux runner does not ship. They are needed even with the offscreen
      # Qt platform: without them "import PySide6.QtWidgets" fails and
      # Tests/conftest.py cannot be collected at all.
      - name: Install Qt system libraries (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # Verify uv.lock matches pyproject.toml (+ test extra)
      - name: Check lockfile consistency
        run: uv lock --check

      # Non-negotiable: exact env from uv.lock (+ test deps)
      - name: Sync (locked)
        run: uv sync --locked --group test --extra gui

      - name: Build coverage file (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv run pytest --junitxml=pytest.xml \
            --cov=pyPLUTO --cov-report=term-missing Tests/ \
            | tee pytest-coverage.txt

      - name: Run tests (non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest -v Tests/

      # On a push there is no PR to comment on: this only computes the badge
      - name: Pytest coverage comment
        if: matrix.os == 'ubuntu-latest'
        id: coverageComment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml

      # Only master writes the badge, so a branch never shows its own coverage
      - name: Create the Badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.PYTEST_COVERAGE_COMMENT }}
          gistID: 384b1f3a3a3b74cdbd65c4e3dce0632f
          filename: pytest-coverage-comment__main.json
          label: Coverage
          message: ${{ steps.coverageComment.outputs.coverage }}
          color: ${{ steps.coverageComment.outputs.color }}
          namedLogo: pytest
