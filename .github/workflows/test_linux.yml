name: Linux Tests

# Pull requests only; every push is tested by the golden workflow
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        sync-args: [""]
        include:
          - os: ubuntu-22.04
            python-version: "3.11"
            sync-args: --resolution=lowest-direct
          # Flags an existing entry (no new job): the one that reports coverage
          - os: ubuntu-24.04
            python-version: "3.14"
            sync-args: ""
            coverage: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clean untracked files and bytecode
        run: git clean -xfd

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          prune-cache: false

      # PySide6, pulled in by --all-extras, links against the system GL/EGL
      # libraries, which the GitHub Linux runners do not ship. They are needed
      # even with the offscreen Qt platform: without them
      # "import PySide6.QtWidgets" fails and Tests/conftest.py cannot be
      # collected at all.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # A fork's PR gets no golden run, so check uv.lock against pyproject here
      - name: Check lockfile consistency
        if: matrix.coverage
        run: uv lock --check

      - name: Sync environment
        run: uv sync --all-extras --all-groups ${{ matrix.sync-args }}

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: uv run --no-sync pytest -v ./Tests

      - name: Run tests with coverage
        if: matrix.coverage
        shell: bash
        run: |
          uv run --no-sync pytest --junitxml=pytest.xml \
            --cov=pyPLUTO --cov-report=term-missing ./Tests \
            | tee pytest-coverage.txt

      # A fork's PR has a read-only token and cannot be commented on
      - name: Pytest coverage comment
        if: matrix.coverage && github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml

